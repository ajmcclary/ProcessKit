name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build & test
    # ProcessKit has zero dependencies (no private-sibling clones), so no
    # WORKSPACE_READ_PAT auth is needed here, unlike the other workspace
    # packages. The Xcode selection mirrors the sibling workflows: pick the
    # newest installed Xcode so the swift-tools-version 6.3 manifest parses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          latest="$( (ls -d /Applications/Xcode_*.app 2>/dev/null || true) | sort -V | tail -n1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          else
            echo "No /Applications/Xcode_*.app found; keeping the runner's default toolchain"
          fi
          xcodebuild -version
          swift --version

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
